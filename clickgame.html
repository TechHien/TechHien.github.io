
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>water scarcity</title>

<style>
* { box-sizing: border-box; }

body {
    margin: 0;
    background: #e7f0e9;
    color: #354b4a;
    font-family: Arial, sans-serif;
}

header {
    background: #315b65;
    color: white;
    padding: 16px 22px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 20px;
    flex-wrap: wrap;
}

header h1 {
    font-size: 20px;
    font-weight: 600;
    margin: 0;
}

header p {
    font-size: 12px;
    color: #c6e1dc;
    margin: 5px 0 0;
}

#reset {
    background: #ffffff20;
    border: 1px solid #ffffff66;
    color: white;
    padding: 9px 13px;
    border-radius: 7px;
    cursor: pointer;
}

main {
    max-width: 1200px;
    margin: auto;
    padding: 20px;
}

/* water supply */

.supply {
    background: white;
    border-radius: 12px;
    padding: 12px 15px;
    margin-bottom: 15px;
    box-shadow: 0 3px 12px #304e4810;
}

.supply-top {
    display: flex;
    justify-content: space-between;
    font-size: 13px;
    margin-bottom: 9px;
}

.supply-track {
    height: 15px;
    background: #e0e9e6;
    border-radius: 20px;
    overflow: hidden;
}

#waterFill {
    height: 100%;
    width: 0%;
    background: linear-gradient(90deg, #53b9d4, #318fbd);
    border-radius: 20px;
    transition: width .8s;
}

.instructions {
    color: #708582;
    font-size: 13px;
    margin-bottom: 13px;
}

#world {
    width: 100%;
    overflow: hidden;
    border: 5px solid white;
    border-radius: 14px;
    box-shadow: 0 5px 20px #304e4820;
    background: #acd58f;
}

#town {
    display: block;
    width: 100%;
    height: auto;
}

.building {
    stroke: #806b51;
    stroke-width: 3;
}

.hotspot {
    cursor: pointer;
    transition: filter .2s;
}

.hotspot:hover {
    filter: brightness(1.12);
}

.hotspot.found {
    opacity: .5;
    cursor: default;
}

.hotspot .outline {
    fill: transparent;
    stroke: transparent;
    stroke-width: 5;
}

.hotspot:hover .outline {
    stroke: #fff4b0;
}

/* pedestrians */

.person {
    pointer-events: none;
}

.walk-right {
    animation: walkRight var(--speed) linear infinite;
}

.walk-left {
    animation: walkLeft var(--speed) linear infinite;
}

.legs {
    transform-box: fill-box;
    transform-origin: top;
    animation: legs .3s infinite alternate;
}

.legs.second {
    animation-delay: .3s;
}

.arms {
    transform-box: fill-box;
    transform-origin: top;
    animation: arms .3s infinite alternate;
}

.arms.second {
    animation-delay: .3s;
}

@keyframes legs {
    from { transform: rotate(-22deg); }
    to { transform: rotate(22deg); }
}

@keyframes arms {
    from { transform: rotate(18deg); }
    to { transform: rotate(-18deg); }
}

@keyframes walkRight {
    from { transform: translateX(-80px); }
    to { transform: translateX(750px); }
}

@keyframes walkLeft {
    from { transform: translateX(750px); }
    to { transform: translateX(-80px); }
}

/* cars */

.car {
    animation: drive var(--speed) linear infinite;
}

@keyframes drive {
    from { transform: translateX(-180px); }
    to { transform: translateX(1250px); }
}

/* water pipes */

.pipe {
    fill: none;
    stroke: #607782;
    stroke-width: 16;
    stroke-linejoin: round;
    stroke-linecap: round;
}

.pipe-light {
    fill: none;
    stroke: #9aafb4;
    stroke-width: 5;
}

.flow {
    fill: none;
    stroke: #4cc5eb;
    stroke-width: 4;
    stroke-dasharray: 10 12;
    animation: flow 1s linear infinite;
}

@keyframes flow {
    to { stroke-dashoffset: -22; }
}

.drip {
    animation: drip 1s infinite;
}

@keyframes drip {
    from { transform: translateY(-3px); opacity: 0; }
    50% { opacity: 1; }
    to { transform: translateY(15px); opacity: 0; }
}

/* airport */

.runway {
    fill: #626e72;
    stroke: #49575b;
    stroke-width: 3;
}

.runway-line {
    stroke: #f4e8b8;
    stroke-width: 4;
    stroke-dasharray: 25 18;
}

/* modal */

#modal {
    display: none;
    position: fixed;
    inset: 0;
    background: #142d35d9;
    z-index: 20;
    align-items: center;
    justify-content: center;
    padding: 15px;
}

#modal.show {
    display: flex;
}

.panel {
    background: #f8fbf8;
    width: 100%;
    max-width: 640px;
    max-height: 90vh;
    overflow-y: auto;
    border-radius: 15px;
    padding: 25px;
}

.panel h2 {
    margin-top: 0;
}

.subtitle {
    color: #738782;
    font-size: 13px;
    line-height: 1.6;
}

.game-area {
    background: #e8f1ec;
    border-radius: 12px;
    padding: 18px;
    margin: 18px 0;
    text-align: center;
}

.primary {
    background: #347f78;
    color: white;
    border: 0;
    border-radius: 8px;
    padding: 12px 19px;
    cursor: pointer;
}

.secondary {
    background: #e3ece7;
    color: #455d56;
    border: 0;
    border-radius: 8px;
    padding: 10px 15px;
    cursor: pointer;
}

.explanation {
    background: #e8f1eb;
    border-left: 4px solid #459c82;
    border-radius: 6px;
    padding: 17px;
    line-height: 1.65;
    margin: 18px 0;
}

/* airport game */

.house-grid, .ice-grid {
    display: flex;
    justify-content: center;
    flex-wrap: wrap;
    gap: 10px;
    margin: 18px 0;
}

.house-option, .ice {
    border: 2px solid #b9d0c6;
    background: white;
    padding: 13px;
    border-radius: 9px;
    cursor: pointer;
}

.house-option.selected {
    background: #c6e9d2;
    border-color: #438e65;
}

.plane-button {
    display: block;
    width: 100%;
    background: #d5e8f0;
    border: 2px dashed #8eafb9;
    padding: 20px;
    border-radius: 12px;
    font-size: 35px;
    cursor: pointer;
}


/* animated house-building game */
.house-option {
    min-width: 112px;
    min-height: 132px;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 7px;
    transition: background .2s, border-color .2s, transform .2s;
}
.house-option svg {
    width: 76px;
    height: 76px;
    overflow: visible;
}
.house-option.selected {
    transform: translateY(-5px);
    box-shadow: 0 5px 0 #8fc3a2;
}
.house-option.selected .house-build {
    transform-origin: 50% 100%;
    animation: houseBuild .55s cubic-bezier(.2,.8,.2,1) both;
}
.house-option.sent {
    animation: houseDepart .55s ease-in forwards;
    pointer-events: none;
}
@keyframes houseBuild {
    from { transform: scaleY(.05); opacity: .35; }
    to { transform: scaleY(1); opacity: 1; }
}
@keyframes houseDepart {
    to { transform: translate(35px,-65px) scale(.45); opacity: 0; }
}
.plane-button {
    position: relative;
    overflow: hidden;
    min-height: 86px;
}
.plane-art {
    display: inline-block;
    font-size: 0;
    vertical-align: middle;
}
.plane-art svg {
    width: 112px;
    height: 48px;
}
.plane-button.launching .plane-art {
    animation: planeLaunch 1.05s cubic-bezier(.35,.05,.7,.35) forwards;
}
@keyframes planeLaunch {
    0% { transform: translateX(0) translateY(0) rotate(0); }
    35% { transform: translateX(65px) translateY(-8px) rotate(-4deg); }
    100% { transform: translateX(520px) translateY(-125px) rotate(-9deg); opacity: 0; }
}

/* illustrated pipe-matching game */
.pipe-grid {
    max-width: 490px;
    gap: 12px;
}
.pipe-button {
    min-height: 112px;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 5px;
    font-weight: 700;
    color: #47616a;
    position: relative;
    overflow: hidden;
    transition: border-color .2s, background .2s, transform .2s;
}
.pipe-button svg {
    width: 100%;
    max-width: 150px;
    height: 52px;
    overflow: visible;
}
.pipe-button .pipe-metal {
    fill: none;
    stroke: #718891;
    stroke-width: 13;
    stroke-linecap: round;
    stroke-linejoin: round;
}
.pipe-button .pipe-highlight {
    fill: none;
    stroke: #b8cbd0;
    stroke-width: 4;
    stroke-linecap: round;
}
.pipe-button .pipe-water {
    fill: none;
    stroke: #55c9ee;
    stroke-width: 5;
    stroke-linecap: round;
    stroke-dasharray: 8 10;
    opacity: 0;
}
.pipe-button.selected {
    background: #e1f3f6;
    border-color: #399bb5;
    transform: translateY(-2px);
    box-shadow: 0 4px 0 #b4dce4;
}
.pipe-button.done {
    background: #d8f1df;
    border-color: #65ad7b;
}
.pipe-button.done .pipe-water {
    opacity: 1;
    animation: pipeWaterFlow .7s linear infinite;
}
@keyframes pipeWaterFlow {
    to { stroke-dashoffset: -36; }
}
.pipe-button.done::after {
    content: "water flowing";
    color: #32845a;
    font-size: 11px;
    font-weight: 600;
}

/* climate game */

.ice {
    font-size: 27px;
}

.ocean {
    background: #6bbce0;
    border: 6px solid #b6e4ef;
    border-radius: 50%;
    padding: 25px;
    max-width: 220px;
    margin: 15px auto;
    color: #164b6b;
    font-weight: bold;
}

/* pipes game */

.pipe-grid {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 10px;
    max-width: 360px;
    margin: 20px auto;
}

.pipe-button {
    background: white;
    border: 2px solid #b9ccca;
    padding: 16px 8px;
    border-radius: 8px;
    cursor: pointer;
}

.pipe-button.selected {
    background: #c8e9dc;
    border-color: #388b75;
}

.pipe-button.done {
    background: #b6e5c4;
}

@media(max-width:600px) {
    main { padding: 10px; }
    .panel { padding: 17px; }
}
</style>
</head>

        <circle cx="72" cy="34" r="9" fill="#37494a"/>
    </g>
    </g>

    <!-- pedestrians -->
    <g id="people">

        <g class="person walk-right" style="--speed:19s">
            <use href="#person" transform="translate(30 375)"
                 style="--shirt:#e36c5d"/>
        </g>

        <g class="person walk-left" style="--speed:22s">
            <use href="#person" transform="translate(900 375)"
                 style="--shirt:#5687bb"/>
        </g>

        <g class="person walk-right population-extra"
           style="--speed:24s;animation-delay:-8s">
            <use href="#person" transform="translate(120 550) scale(.8)"
                 style="--shirt:#d7a64e"/>
        </g>

        <g class="person walk-left population-extra"
           style="--speed:20s;animation-delay:-4s">
            <use href="#person" transform="translate(900 550) scale(.8)"
                 style="--shirt:#9c72b6"/>
        </g>

        <g class="person walk-right population-extra"
           style="--speed:21s;animation-delay:-12s">
            <use href="#person" transform="translate(250 375) scale(.85)"
                 style="--shirt:#4a9a76"/>
        </g>

        <g class="person walk-left population-extra"
           style="--speed:25s;animation-delay:-15s">
            <use href="#person" transform="translate(1000 375) scale(.85)"
                 style="--shirt:#d7819f"/>
        </g>

        <g class="person walk-right population-extra"
           style="--speed:18s;animation-delay:-5s">
            <use href="#person" transform="translate(80 540) scale(.8)"
                 style="--shirt:#a76b55"/>
        </g>

        <g class="person walk-left population-extra"
           style="--speed:23s;animation-delay:-10s">
            <use href="#person" transform="translate(750 375) scale(.9)"
                 style="--shirt:#7b7bc0"/>
        </g>

    </g>

    <!-- airport discovery: label is positioned beside the relocated terminal -->
    <g class="hotspot" id="airportSpot"
       onclick="startGame('population')">
        <rect x="785" y="505" width="300" height="185"
              rx="12" class="outline"/>
        <rect x="880" y="610" width="100" height="24"
              rx="6" fill="#fff6db" stroke="#b9a77c"/>
        <text x="930" y="627" text-anchor="middle"
              font-size="12" fill="#536452">airport</text>
    </g>

    <!-- climate discovery -->
    <g class="hotspot" id="climateSpot"
       onclick="startGame('climate')">

        <circle cx="1030" cy="55" r="30"
                fill="#f3c45d" stroke="#d99f3e" stroke-width="4"/>

        <g stroke="#e5aa42" stroke-width="5">
            <path d="M1030 12 V0 M1030 110 V98
                     M987 55 H975 M1085 55 H1073
                     M1000 25 L990 15 M1070 95 L1060 85
                     M1000 85 L990 95 M1070 15 L1060 25"/>
        </g>

        <circle class="outline" cx="1030" cy="55" r="53"/>
    </g>

    <!-- infrastructure discovery -->
    <g class="hotspot" id="pipesSpot"
       onclick="startGame('pipes')">
        <circle class="outline" cx="255" cy="705" r="48"/>
        <rect x="188" y="655" width="135" height="24"
              rx="5" fill="#fff6db" stroke="#b9a77c"/>
        <text x="255" y="672" text-anchor="middle"
              font-size="12" fill="#536452">leaking pipe</text>
    </g>

    </svg>
    </div>

    <p class="subtitle">
        look around carefully. not everything is what it seems.
    </p>

</main>

<div id="modal">
    <div class="panel" id="panel"></div>
</div>

<script>

// game progress

const found = {
    population: false,
    climate: false,
    pipes: false
};

let houses = new Set();
let iceCount = 0;
let pipesDone = new Set();
let pipeSelected = null;
let planeLaunched = false;

const explanations = {

population: {
    title: "population growth",
    body: `
        <h3>what is population growth?</h3>
        Population growth occurs when the number of people living
        in an area increases over time.

        <h3>how does it cause water scarcity?</h3>
        Every person needs freshwater for drinking, cooking,
        cleaning, sanitation and other everyday activities.

        As a population grows, the demand for freshwater increases.
        Cities may struggle to provide enough water if their
        reservoirs and water systems cannot keep up.

        <h3>real-world consequences</h3>
        <ul>
            <li>greater demand for drinking water.</li>
            <li>more pressure on rivers and groundwater.</li>
            <li>competition between households, farms and industries.</li>
            <li>overuse of existing freshwater supplies.</li>
        </ul>

        <h3>possible solutions</h3>
        Better urban planning, efficient water use, improved
        infrastructure and sustainable management of water
        resources can help growing cities.
    `
},

climate: {
    title: "climate change",
    body: `
        <h3>what is climate change?</h3>
        Climate change refers to long-term changes in Earth's
        temperatures and weather patterns. Modern global warming
        is mainly caused by human activities that release
        greenhouse gases.

        <h3>how does it cause water scarcity?</h3>
        Higher temperatures increase evaporation. Changing
        rainfall patterns can also cause some regions to
        experience longer or more severe droughts.

        Glaciers and seasonal snowpacks provide important
        freshwater supplies to many communities. Their decline
        can affect the amount and timing of water available.

        <h3>real-world consequences</h3>
        <ul>
            <li>more severe droughts in some regions.</li>
            <li>unpredictable rainfall.</li>
            <li>declining glacier and snow reserves.</li>
            <li>greater pressure on agricultural water supplies.</li>
        </ul>

        <h3>possible solutions</h3>
        Reducing greenhouse gas emissions, protecting catchments,
        improving water storage and preparing for droughts
        can reduce the risks.
    `
},

pipes: {
    title: "lack of water infrastructure",
    body: `
        <h3>what is water infrastructure?</h3>
        Water infrastructure includes the systems used to
        collect, treat, store and distribute water.

        This includes reservoirs, treatment plants, pumps
        and water pipes.

        <h3>how does poor infrastructure cause water scarcity?</h3>
        Old or damaged pipes can leak treated water before it
        reaches households.

        Communities without adequate treatment facilities,
        storage systems or distribution networks may struggle
        to access safe and reliable water, even when water
        sources exist nearby.

        <h3>real-world consequences</h3>
        <ul>
            <li>water lost through leaking pipes.</li>
            <li>unreliable access to drinking water.</li>
            <li>contamination risks from damaged systems.</li>
            <li>unequal access to water between communities.</li>
        </ul>

        <h3>possible solutions</h3>
        Replacing ageing pipes, maintaining water systems,
        building treatment facilities and improving storage
        can make water supplies more reliable.
    `
}

};

// modal

function openModal(html) {
    document.getElementById("panel").innerHTML = html;
    document.getElementById("modal").classList.add("show");
}

function closeModal() {
    document.getElementById("modal").classList.remove("show");
}

// start games

function startGame(type) {
    if (found[type]) return;

    if (type === "population") populationGame();
    if (type === "climate") climateGame();
    if (type === "pipes") pipeGame();
}

// population game

function populationGame() {
    houses.clear();
    planeLaunched = false;

    openModal(`
        <h2>airport expansion</h2>
        <p class="subtitle">
            the town is overcrowded. build new houses in a distant
            town and send them there by aircraft.
        </p>

        <div class="game-area">
            <h3>build three houses</h3>

            <div class="house-grid">
                ${[1,2,3,4,5].map(n => `
                    <button class="house-option"
                        onclick="selectHouse(${n},this)">
                        <svg viewBox="0 0 90 82" aria-hidden="true">
                            <g class="house-build">
                                <path d="M8 35 L45 6 L82 35" fill="#ad6951" stroke="#80523e" stroke-width="3" stroke-linejoin="round"/>
                                <rect x="15" y="34" width="60" height="43" rx="2" fill="#e6bd88" stroke="#806b51" stroke-width="3"/>
                                <rect x="24" y="43" width="14" height="15" fill="#a8dce3" stroke="#806b51" stroke-width="2"/>
                                <rect x="52" y="43" width="14" height="15" fill="#a8dce3" stroke="#806b51" stroke-width="2"/>
                                <rect x="39" y="56" width="13" height="21" fill="#85644b"/>
                            </g>
                        </svg>
                        <span>house ${n}</span>
                    </button>
                `).join("")}
            </div>

            <p id="houseStatus">houses built: 0 / 3</p>

            <button class="plane-button" id="planeButton" onclick="sendPlane()">
                <span class="plane-art">
                    <svg viewBox="0 0 140 60" aria-hidden="true">
                        <path d="M8 30 L55 23 L70 4 L80 4 L83 23 L129 29 L129 36 L83 34 L78 53 L69 53 L62 34 L8 37Z"
                              fill="#f7fbf5" stroke="#647e8b" stroke-width="2.5" stroke-linejoin="round"/>
                        <path d="M90 27 L112 29 L90 31Z" fill="#8fc8dc"/>
                        <circle cx="47" cy="30" r="3" fill="#6ba8c5"/>
                    </svg>
                </span>
                <span>send aircraft</span>
            </button>

            <p id="planeMessage">
                send the houses to their new town.
            </p>
        </div>

        <button class="secondary" onclick="closeModal()">close</button>
    `);
}

function selectHouse(n, button) {
    if (houses.has(n)) {
        houses.delete(n);
        button.classList.remove("selected");
    } else if (houses.size < 3) {
        houses.add(n);
        button.classList.add("selected");
    }

    document.getElementById("houseStatus").textContent =
        "houses built: " + houses.size + " / 3";
}

function sendPlane() {
    if (houses.size !== 3) {
        document.getElementById("planeMessage").textContent =
            "build three houses first!";
        return;
    }
    if (planeLaunched) return;

    planeLaunched = true;
    document.querySelectorAll(".house-option.selected").forEach((house, index) => {
        house.style.animationDelay = (index * 120) + "ms";
        house.classList.add("sent");
    });

    const planeButton = document.getElementById("planeButton");
    planeButton.classList.add("launching");
    document.getElementById("planeMessage").textContent =
        "houses loaded. aircraft departing...";

    setTimeout(() => completeGame("population"), 1150);
}

// climate game

function climateGame() {
    iceCount = 0;

    openModal(`
        <h2>emergency ice delivery</h2>
        <p class="subtitle">
            so yknow how climate change causes water scarcity
            basically what you have to do is drop ice cubes into the ocean.
        </p>

        <div class="game-area">
            <h3>drop five ice cubes into the ocean</h3>

            <div class="ice-grid">
                ${[1,2,3,4,5].map(n => `
                    <button class="ice" onclick="dropIce(this)">
                        ice
                    </button>
                `).join("")}
            </div>

            <div class="ocean">
                ocean
                <p id="iceStatus">ice delivered: 0 / 5</p>
            </div>

            <p id="iceMessage">click the ice cubes.</p>
        </div>

        <button class="secondary" onclick="closeModal()">close</button>
    `);
}

function dropIce(button) {
    if (button.disabled) return;

    button.disabled = true;
    button.style.opacity = ".25";

    iceCount++;

    document.getElementById("iceStatus").textContent =
        "ice delivered: " + iceCount + " / 5";

    if (iceCount === 5) {
        document.getElementById("iceMessage").textContent =
            "you have cooled approximately 0.0000001% of the ocean.";

        setTimeout(() => completeGame("climate"), 800);
    }
}

// pipe game

function pipeGame() {
    pipesDone.clear();
    pipeSelected = null;

    openModal(`
        <h2>emergency plumbing</h2>
        <p class="subtitle">
            three houses have lost their water supply.
            connect the matching pipes to restore water.
        </p>

        <div class="game-area">
            <h3>connect matching pipes</h3>

            <p>select a source, then its matching destination.</p>

            <div class="pipe-grid">
                <button class="pipe-button"
                    onclick="selectPipe('source a',this)">
                    <svg viewBox="0 0 140 55" aria-hidden="true">
                        <path class="pipe-metal" d="M8 28 H54 Q67 28 67 15 V8"/>
                        <path class="pipe-highlight" d="M8 23 H52 Q62 23 62 14 V8"/>
                        <path d="M8 15 V41 M1 15 H15 M1 41 H15" stroke="#526b75" stroke-width="4" stroke-linecap="round"/>
                        <circle cx="67" cy="8" r="7" fill="#d7ad58" stroke="#806a43" stroke-width="2"/>
                    </svg>
                    <span>source a</span>
                </button>

                <button class="pipe-button"
                    onclick="selectPipe('home c',this)">
                    <svg viewBox="0 0 140 55" aria-hidden="true">
                        <path class="pipe-metal" d="M8 8 V28 Q8 40 22 40 H128"/>
                        <path class="pipe-highlight" d="M13 8 V26 Q13 35 23 35 H128"/>
                        <path d="M115 31 L128 40 L115 49" fill="none" stroke="#526b75" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
                        <rect x="2" y="2" width="12" height="12" rx="3" fill="#d7ad58" stroke="#806a43" stroke-width="2"/>
                    </svg>
                    <span>home c</span>
                </button>

                <button class="pipe-button"
                    onclick="selectPipe('source b',this)">
                    <svg viewBox="0 0 140 55" aria-hidden="true">
                        <path class="pipe-metal" d="M8 28 H128"/>
                        <path class="pipe-highlight" d="M8 23 H128"/>
                        <path d="M8 15 V41 M1 15 H15 M1 41 H15" stroke="#526b75" stroke-width="4" stroke-linecap="round"/>
                        <circle cx="70" cy="28" r="9" fill="#d7ad58" stroke="#806a43" stroke-width="2"/>
                        <path d="M70 19 V37 M61 28 H79" stroke="#806a43" stroke-width="2"/>
                    </svg>
                    <span>source b</span>
                </button>

                <button class="pipe-button"
                    onclick="selectPipe('home a',this)">
                    <svg viewBox="0 0 140 55" aria-hidden="true">
                        <path class="pipe-metal" d="M8 40 H118 Q130 40 130 28 V8"/>
                        <path class="pipe-highlight" d="M8 35 H116 Q125 35 125 27 V8"/>
                        <path d="M118 8 H140 M118 1 H140" stroke="#526b75" stroke-width="4" stroke-linecap="round"/>
                        <rect x="122" y="2" width="16" height="12" rx="3" fill="#d7ad58" stroke="#806a43" stroke-width="2"/>
                    </svg>
                    <span>home a</span>
                </button>

                <button class="pipe-button"
                    onclick="selectPipe('source c',this)">
                    <svg viewBox="0 0 140 55" aria-hidden="true">
                        <path class="pipe-metal" d="M8 8 V28 Q8 40 20 40 H128"/>
                        <path class="pipe-highlight" d="M13 8 V26 Q13 35 21 35 H128"/>
                        <path d="M8 2 V14 M1 2 H15" stroke="#526b75" stroke-width="4" stroke-linecap="round"/>
                        <circle cx="65" cy="40" r="8" fill="#d7ad58" stroke="#806a43" stroke-width="2"/>
                    </svg>
                    <span>source c</span>
                </button>

                <button class="pipe-button"
                    onclick="selectPipe('home b',this)">
                    <svg viewBox="0 0 140 55" aria-hidden="true">
                        <path class="pipe-metal" d="M8 8 V28 Q8 40 20 40 H128"/>
                        <path class="pipe-highlight" d="M13 8 V26 Q13 35 21 35 H128"/>
                        <path class="pipe-water" d="M8 8 V28 Q8 40 20 40 H128"/>
                        <path d="M118 31 L130 40 L118 49" fill="none" stroke="#526b75" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
                    </svg>
                    <span>home b</span>
                </button>
            </div>

            <p id="pipeStatus">pipes repaired: 0 / 3</p>
            <p id="pipeMessage">no connections yet.</p>
        </div>

        <button class="secondary" onclick="closeModal()">close</button>
    `);
}

function selectPipe(name, button) {
    if (button.classList.contains("done")) return;

    if (!pipeSelected) {
        if (!name.startsWith("source")) {
            document.getElementById("pipeMessage").textContent =
                "select a water source first!";
            return;
        }

        pipeSelected = name;
        button.classList.add("selected");

        document.getElementById("pipeMessage").textContent =
            "now select the matching home.";

        return;
    }

    if (name.startsWith("source")) {
        document.querySelectorAll(".pipe-button").forEach(b =>
            b.classList.remove("selected")
        );

        pipeSelected = name;
        button.classList.add("selected");
        return;
    }

    const source = pipeSelected.slice(-1);
    const destination = name.slice(-1);

    if (source === destination) {
        pipesDone.add(source);

        document.querySelectorAll(".pipe-button").forEach(b => {
            if (b.textContent.trim().endsWith(source)) {
                b.classList.remove("selected");
                b.classList.add("done");
            }
        });

        document.getElementById("pipeMessage").textContent =
            "connection successful! water restored.";
    } else {
        document.getElementById("pipeMessage").textContent =
            "incorrect connection. try again.";

        document.querySelectorAll(".pipe-button").forEach(b =>
            b.classList.remove("selected")
        );
    }

    pipeSelected = null;

    document.getElementById("pipeStatus").textContent =
        "pipes repaired: " + pipesDone.size + " / 3";

    if (pipesDone.size === 3) {
        setTimeout(() => completeGame("pipes"), 700);
    }
}

// complete a mission

function completeGame(type) {
    if (found[type]) return;

    found[type] = true;

    // mark discovery
    const target = document.getElementById(
        type === "population" ? "airportSpot" :
        type === "climate" ? "climateSpot" :
        "pipesSpot"
    );

    target.classList.add("found");

    // reduce population after airport mission
    if (type === "population") {
        document.querySelectorAll(".population-extra").forEach(person => {
            person.style.display = "none";
        });
    }

    // increase town water supply
    updateProgress();

    const info = explanations[type];

    openModal(`
        <div style="text-align:center">
            <h2>problem solved!</h2>
            <h1 style="font-size:38px">+33% water</h1>
            <p class="subtitle">${info.title}</p>
        </div>

        <div class="explanation">
            ${info.body}
        </div>

        <button class="primary" onclick="afterExplanation()">
            continue exploring
        </button>
    `);
}

function afterExplanation() {
    closeModal();

    if (Object.values(found).every(Boolean)) {
        setTimeout(showVictory, 300);
    }
}

// water progress

function updateProgress() {
    const total = Object.values(found).filter(Boolean).length;
    const percentage = Math.round(total / 3 * 100);

    document.getElementById("waterFill").style.width =
        percentage + "%";

    document.getElementById("waterPercent").textContent =
        percentage + "%";
}

// victory

function showVictory() {
    openModal(`
        <div style="text-align:center">
            <h1>town restored!</h1>
            <p style="font-size:50px">100%</p>
            <h2>all problems solved</h2>
        </div>

        <div class="explanation">
            <h3>what have we learned?</h3>

            Water scarcity is influenced by many interconnected
            factors.

            Population growth increases demand, climate change
            affects freshwater availability, and poor
            infrastructure prevents water from reaching people.

            Understanding these problems helps communities
            develop sustainable solutions.
        </div>

        <button class="primary" onclick="resetGame()">
            play again
        </button>
    `);
}

// reset

function resetGame() {
    Object.keys(found).forEach(key => found[key] = false);

    document.querySelectorAll(".hotspot").forEach(el =>
        el.classList.remove("found")
    );

    document.querySelectorAll(".population-extra").forEach(person => {
        person.style.display = "";
    });

    houses.clear();
    pipesDone.clear();

    updateProgress();
    closeModal();
}

</script>
</body>
</html>
